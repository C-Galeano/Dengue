{# Inline SVG icons (Feather-style, stroke inherits currentColor). Usage: {{ icon("users") }} #}
{% macro icon(name) -%}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if name == "drop" %}<path d="M12 2.7s7 7.2 7 12.1a7 7 0 0 1-14 0c0-4.9 7-12.1 7-12.1z"/>
  {%- elif name == "clipboard" %}<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 14l2 2 4-4"/>
  {%- elif name == "users" %}<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>
  {%- elif name == "chart" %}<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>
  {%- elif name == "alert" %}<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>
  {%- elif name == "arrow" %}<path d="M5 12h14M13 6l6 6-6 6"/>
  {%- elif name == "upload" %}<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/>
  {%- elif name == "target" %}<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
  {%- elif name == "search" %}<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
  {%- elif name == "activity" %}<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
  {%- elif name == "shield" %}<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>
  {%- elif name == "filter" %}<path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>
  {%- elif name == "cpu" %}<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>
  {%- elif name == "server" %}<rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/>
  {%- elif name == "code" %}<path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>
  {%- elif name == "file" %}<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>
  {%- elif name == "back" %}<path d="M19 12H5M11 18l-6-6 6-6"/>
  {%- endif %}
</svg>
{%- endmacro %}
