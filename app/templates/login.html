{% extends "base.html" %}
{% block content %}
<h1>Acceso de trabajadores</h1>
{% if error %}<p style="color:#b00">{{ error }}</p>{% endif %}
<form method="post">
  <p><label>Usuario<br><input name="username" required autofocus></label></p>
  <p><label>Contraseña<br><input type="password" name="password" required></label></p>
  <button type="submit">Entrar</button>
</form>
{% endblock %}
