# Despliegue en Render (Blueprint). Render lee este archivo al conectar el repositorio.
services:
  - type: web
    name: dengue-forecasting
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # gunicorn es un servidor WSGI de producción; el servidor de "flask run" es solo para desarrollo.
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
