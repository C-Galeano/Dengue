# Render deployment (Blueprint). Render reads this file when the repository is connected.
services:
  - type: web
    name: dengue-forecasting
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # gunicorn is a production WSGI server; the "flask run" server is for development only.
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
